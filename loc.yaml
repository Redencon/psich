    used_link: This link was used by another user. If you think this was a mistake, contact Admin.
    time: Choose time to recieve daily polls.
    time_chosen: You've chosen time 
    poll_expired: Poll expired.
    poll_answer: You answered {answer}
    unsub_no: Great.
    unsub_yes: Then so be it.
