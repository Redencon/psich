ru:
  name:
    - Настенька
    - Диана
  description:
    - |
      Бот ежедневных опросов настроения
      Админ: @Folegle
      Версия для общего пользования:
      @Redencon_PSI_bot
    - |
      Бот ежедневный опросов настроения
      Админ: @Folegle
      Версия для студентов МФТИ:
      @MKI_PSI_bot
  short_description: Ежедневные опросы настроения
  responses:
    0:
      - О БОЖЕ, КАК ЖЕ ТЫ ХОРОШ
      - Я рада, что у тебя такое замечательное настроение!
      - Я очень рада за тебя! Мне даже интересно, что же тебя так порадовало.
      - Как здорово, что у тебя такой прекрасный день!
    1:
      - Рада слышать, что у тебя все идет так гладко. Надеюсь, что твой настрой будет оставаться позитивным и далее.
      - Отлично! Я очень рада за тебя!
      - Как же здорово, что у тебя все отлично!
    2:
      - Я рада, что твоё настроение в порядке.
      - Рада слышать, что у тебя все в порядке. Если что и произойдёт, я уверена, ты найдешь необходимую помощь.
      - Отлично, что у тебя хорошее настроение! Желаю тебе успешного продолжения дня.
    3:
      - Нормально - это уже хорошо! Если тебя что-то тревожит, не стесняйся об этом рассказать.
      - Понимаю, что бывают такие дни. Искренне надеюсь, что дела станут лучше совсем скоро.
      - Рада видеть, что у тебя все в порядке. Я буду рада тебя выслушать, если ты захочешь поделиться своими мыслями.
    4:
      - Понимаю, что бывают такие дни. Я уверена, что ты найдёшь необходимую тебе поддержку.
      - Жаль видеть, что дела не очень. Может быть тебе надо с чем-то помочь?
      - Не переживай, все бывает. Может быть, если ты поделишься своими тревогами, тебе станет легче?
    5:
      - Мне жаль, что тебе сложно. Если тебе нужна помощь, я всегда буду рядом.
      - Надеюсь, что вскоре тебе станет лучше. Не бойся попросить помощи, если она тебе нужна.
      - Мы все иногда испытываем низкие моменты. Не бойся обратиться к близким за помощью, и ты станешь сильнее.
    6:
      - Мне жаль, что у тебя плохое настроение. Если тебе нужна помощь, я всегда готова тебя выслушать.
      - Я искренне тебе сочувствую. Не стесняйся обращаться за помощью, если тебе кажется, что ты не справляешься.
      - Прости, если мой опрос тебя задел. Я надеюсь, что тебе станет лучше совсем скоро.
  service:
    poll: 
      mood: |
        Время для ежедневного опроса!
        Как ты оцениваешь своё настроение?
        {} - Замечательно!
        {} - Отлично!
        {} - Хорошо!
        {} - Нормально.
        {} - Не очень.
        {} - Мне тяжело.
        {} - У меня большие трудности.
      health: |
        Время для опроса!
        Как ты оцениваешь своё самочувствие?
        🔴 - Во мне полно энергии!
        🟠 - Мне хорошо!
        🟡 - Не ощущаю проблем.
        🟢 - Мне не очень хорошо.
        🔵 - Меня что-то беспокоит.
        🟣 - Мне плохо.
        🟤 - Мне сейчас тяжело.
    reminder: Я заметила, что ты ещё не заполнил(а) опрос. Пройди его, пожалуйста!
    wanna_get: Вы согласны получать ежедневные опросы о вашем настроении?
    verification: |
      Для использования бота надо пройти верификацию, используя электронную почту. Адрес будет удалён после верификации.
      Введите свой адрес:
    success: Успех!
    get_poll: Какой опрос ты хочешь пройти? 🌠 настроения, 💊 самочувствия, ❎ отмена
    time_cancel: Выбор времени отменён.
    time_kb: Выбери время для опроса.
    time_rm: Выбери время для опроса, которое надо убрать. ➕ - добавить опрос, ❎ - закончить действие.
    type_change: Выбран тип опроса {}
    type_choice: Выбери тип опроса. 🌠 настроения, 💊 самочувствия, 🔴 убрать опрос, ❎ отмена.
    skin: Выбери набор кнопок для опроса настроения
    skin_set: |
      Ты выбрал набор:
      {}
    today_request: Какую статистику ты хочешь посмотреть - 🌠 настроения, 💊 здоровья.
    today_text: Среднее за сегодня среди опросов типа {} - {}.
    today_fail: Недостаточно данных для подсчёта среднего.
    email_wrong_code: Неверный код. Попробуй ещё раз.
    email_wrong_adress: Неверный формат электронной почты. Попробуй ещё раз - напиши в сообщении только свою электронную почту
    email_wrong_domen: Поддерживаются только почтовые адреса домена @phystech.edu. Попробуй ещё раз...
    email_sent: |
      На указанную почту было отправлено письмо с кодом подтверждения.
      Отправь мне полученный код.
    help_fail: Такой команды нет.
    must_register: Для использования бота надо зарегистрироваться. Используй /start
    survey_request: |
      Можешь, пожалуйста, пройти этот короткий опрос?
      {}
    survey_expired: Опрос был закрыт. Спасибо за участие!
    thanks: Спасибо.
    demog_init: |
      Перед началом использования бота, ответьте на несколько коротких вопросов.
      ---
    demog_end: Спасибо за участие в опросе.
    user_overflow: Сейчас у бота слишком много пользователей. Твои сообщения не доходят до операторов
    only_link: Сейчас регистрация в Настеньке доступна только по ссылке приглашению.
    used_link: Эта ссылка была использована другим пользователем. Если вам кажется, что произошла ошибка, свяжитесь с администратором.
    time: Выберите время, в которое я буду отправлять ежедневный опрос.
    time_chosen: Вы выбрали время
    poll_expired: Опрос устарел.
    poll_answer: Вы ответили {answer}
    unsub_no: Ну и замечательно.
    unsub_yes: Да будет так.
    graph_onetime: График можно получить (пока что) только один раз.
    groups_init: |
      Это список групп, в которых ты состоишь. Свяжись с админом, если хочешь чтобы тебя добавили или убрали из группы.
      
      {groups}

      > Позже у тебя будет возможность выбрать себе группу!
    achievements: 🏆Твои достижения🏅
    new_achievement: 🎉НОВОЕ ДОСТИЖЕНИЕ:🎉 
    stats: Твой текущий успех за месяц 
    stats_next: Другой месяц...
    new_operator: Добро пожаловать в чат операторов Настеньки! Здесь можно отвечать на сообщения, которые пользователи пишут боту. Для этого надо использовать reply на сообщение, на которое хочется ответить. Наверху каждого сообщения есть уникальный псевдоним пользователя, по которому его можно опознать. Удачи!
    registration_closed: К сожалению, я не могу верифицировать новых пользователей сейчас. Вернитесь позже.
    beta_survey: Я работаю уже больше двух месяцев и каждый день отправляю тебе опросы настроения. Напиши свой отзыв о моей работя прямо тут — что тебе нравится, чего тебе не хватает, что стоило бы убрать из моей работы. Я буду рада любому сообщению, даже простому спасибо. Так я говорю тебе — Спасибо, за участие в раннем тестировании! Я очень благодарная, что ты участвуешь в моих опросах!
    delete: |
      Вы уверены, что хотите удалить все свои данные?
      ДЕЙСТВИЕ НЕОБРАТИМО
    language: Вы выбрали русский язык
    yes: Да
    no: Нет
    ok: ОК
  achievements:
    streak_3:
      name: Первые шаги
      description: Отвечать на ежедневные опросы ПСИ-бота 3 дня подряд
      congrats: Ты уже 3 дня подряд отвечаешь на мои опросы! Продолжай в том же духе!
    streak_7:
      name: Стабильная неделя
      description: Отвечать на ежедневные опросы ПСИ-бота 7 дней подряд
      congrats: За последнюю неделю ты не пропустил(а) ни одного опроса! Меня впечатляет твоя стабильность.
    streak_14:
      name: Две недели!
      description: Отвечать на ежедневные опросы ПСИ-бота 14 дней подряд
      congrats: Две недели без пропусков! Я очень рада видеть такую преданность.
    streak_30:
      name: Месяц!
      description: Отвечать на ежедневные опросы ПСИ-бота 30 дней подряд
      congrats: За месяц ни одного пропуска! Я очень рада, что ты принимаешь участие в моих опросах. Виртуально обнимаю от команды администраторов (и от себя лично <3)
    streak_61: 
      name: ДВА МЕСЯЦА?!
      description: Отвечать на ежедневные опросы ПСИ-бота 61 день подряд
      congrats: Мы с тобой участвуем в этих опросах уже два месяца. Мне кажется, за это время мы успели стать друзьями :)
    streak_150:  
      name: СЕМЕСТР.
      description: Отвечать на ежедневные опросы ПСИ-бота 150 дней подряд
      congrats: За весь семестр ты не пропустил ни одного вопроса. Я хочу тебя поблагодарить лично. Напиши администратору @Folegle.
    consistency_15:      
      name: Половина от месяца
      description: Ответить на 15 опросов в этом месяце
      congrats: За этот месяц мы прошли через опрос 15 раз. Меня это впечатляет!
    consistency_30:
      name: Полный месяц
      description: Ответить на 30 опросов в этом месяце
      congrats: Ты ответил(а) на (почти?) все опросы в этом семестре! Наверное тебе очень понравится лишний раз посмотреть /stats
    contact:
      name: Разговор по душам
      description: Написать ПСИ-боту сообщение
      congrats: Мы с тобой ещё не общались так лично... Не бойся, я внимательно читаю твои сообщения и постараюсь отвечать как можно быстрее!
    stats:
      name: Разноцветный календарь
      description: Посмотреть статистику за месяц
      congrats: Вот он - твой календарик настроения. Интересно посмотреть как настроение менялось с течением времени, не так ли?
    today:
      name: Посмотреть вокруг
      description: Посмотреть средний результат опроса за сегодня
      congrats: О, я вижу тебе интересно как дела обстоят у других? Держи, всегда пожалуйста!
    good_conversation:
      name: Приятный собеседник
      description: Получить похвалу от команды модераторов.
      congrats: Ты очень приятный собеседник. Мне кажется, это достойно небольшой похвалы с нашей стороны <3
    helper:
      name: Помощь Админу
      description: Помочь Админу с разроботкой ПСИ-бота
      congrats: Администратор лично передаёт тебе большое спасибо за помощь в разработке ПСИ-бота. Я рада, что такие хорошие люди помогли в создании меня. Спасибо.
    operator:
      name: Оператор
      description: Стать Оператором ПСИ-бота
      congrats: Теперь ты мой рот и мои глаза. Я надеюсь, что вместе мы поможем нашим пользователям чувствовать себя лучше.
    admin:
      name: ADMIN
      description: Ты - создатель ПСИ-бота
      congrats: Сам себя не похвалит, как говорится...
    friend:
      name: Друг Админа
      description: Ты - друг Админа и он очень рад, что именно ты пользуешься ПСИ-ботом
      congrats: Привет! Админ хотел передать тебе персональное спасибо, за то что ты со мной общаешься. Надеюсь, мы все вместе сделаем из меня отличный продукт!
  help:
    start: Команда начала работы с ботом. Помогает перезапустить регистрацию если что-то пошло не так или аккаунт был удалён
    help: Комнада для получения инструкций по использованию других команд. Напиши название непонятной команды после /help. Также уведомляю, что можно отправлять сообщения без команд, чтобы поговорить с ПСИ-ботом.
    time: Команда для выбора времени опроса. После отправки предлагает кнопки со всеми доступными на данный момент временами. Время расслыки можно изменить в любой момент. ПСИ-бот отправит ровно один опрос за день вне ависимости от использования это команды.
    sub: Команда для подписки/отписки от ежедневных опросов. После отправки команды надо нажать на кнопку в сообщении чтобы подписаться/отписаться.
    arcana: Получить совет на сегодня в виде карты Таро. Можно использовать не чаще чем раз в неделю. Нужно ответить на опросы последние три дня чтобы использовать.
    stats: Выводит календарь с персональными результатами опроса в этом месяце. Если после команды написать номер месяца, то отобразит результаты за выбранный месяц. Переключение также возможно с помощью кнопок
    today: Выводит средний результат сегодняшнего опроса среди всех пользователей. Обновляется автоматически.
    achievements: Показывает все полученные достижения. Достижения выдаются при выполнении определённых действий. Попробуй собрать все достижения по участию в опросе несколько дней подряд!
    language: Настройка языка, на котором будет говорить бот с тобой. Выбор возможен между русским и английским.
    delete: Удаляет все данные этого пользователя из базы ПСИ-бота. Необратимо. После удаления можно заново создать аккаунт используя /start
  commands:
    start: Начать работу с ботом
    help: Получить помощь по командам
    poll: Пройти опрос
    time: Выбрать время опроса
    skin: Выбрать вид кнопок
    sub: Включить/отключить рассылку
    arcana: Предсказание карт Таро
    stats: Данные за месяц 
    today: Среднее за сегодня
    # achievements: Достижения
    language: Выбрать язык
    delete: УДАЛИТЬ ДАННЫЕ
    # nodata: Данные удалены. Для использования бота используй /start заново
en:
  name:
    - Nastyenka
    - Diana
  description:
    - |
      Bot for daily mood polls
      Bot Admin: @Folegle
      Version for non-MIPT users:
      @Redencon_PSI_bot
    - |
      Bot for daily mood polls
      Bot Admin: @Folegle
      Version for MIPT users:
      @MKI_PSI_bot
  short_description: Daily mood polls bot
  responses:
    0:
      - OH MY GOD, YOU'RE SO GOOD!
      - Well that's wonderful that you're so in tune!
      - I am very happy for you! I wisf for your mood to stay so great longer!
      - How lovely that you're having such a beautiful day!
    1:
      - Glad to hear that everything is going so smoothly for you.
      - That's awesome! I hope you'll have a nice day.
      - I am so glad that you are doung well!
    2:
      - I like your positive mood! I wish your day will be even better!
      - I'm glad to hear that you're doing well.
      - That's great that you are in a good mood! I am really happy about you.
    3:
      - Fine is already good! Let's make this day a little bit better!
      - I understand that there are days like this. Let's believe that everything will be better soon.
      - I am glad to see that you are doing well. Remember that I will always be here to listen to you <3
    4:
      - I understand that there are days like this. Don't be afraid to tell me more.
      - Sorry to see, maybe we can lift up your mood somehow?
      - Don't worry, it happens. Maybe sharing your thoughts would help?
    5:
      - I'm sorry you're having a hard time. If you need to talk, I'm always ready to listen to you.
      - I hope you feel better soon. Is there anything I can do to help you?
      - We all have down moments sometimes. Don't be afraid to ask your loved ones for help and you will become stronger.
    6:
      - I'm sorry you're in a bad mood. If you need help, I'm always there for you.
      - I feel for you wholeheartedly. Feel free to ask for help if you feel like you're not doing well.
      - I'm sorry if my questioning hurt you. If you want, we can try doing something to improve your condition.
  service:
    poll: 
      mood: |
        Time for a daily poll!
        How do you feel yourself today?
        {} - I'm wonderful!
        {} - I'm great!
        {} - I'm good!
        {} - I'm okay.
        {} - I'm not okay.
        {} - I'm struggling.
        {} - I'm having a really hard time.
      health: |
        Time for a poll!
        How do you feel?
        🔴 - I am full of energy!
        🟠 - I feel great!
        🟡 - I don't sense any problems.
        🟢 - I don't feel really well.
        🔵 - I am bothered by something.
        🟣 - I feel bad.
        🟤 - I am struggling.
    reminder: I noticed you haven't answered your poll today. Fill it in, please!
    wanna_get: Do you agree to recieve daily polls?
    verification: |
      To use this bot you have to verify your identity via email. Adress is not stored.
      Enter you email adress:
    success: Success!
    get_poll: Which poll do you want to go? 🌠 mood, 💊 health, ❎ cancel action
    time_choose: NotImplemented
    time_cancel: Time choice cancelled.
    time_kb: Choose poll time.
    time_rm: Choose polling time to be removed. ➕ - add poll, ❎ - end action.
    type_change: New poll type chosen - {}
    type_choice: Choose poll type. 🌠 mood, 💊 health, 🔴 remove poll, ❎ cancel action.
    skin: Choose button set for mood poll
    skin_set: |
      You've chosen these buttons:
      {}
    today_request: Choose which stats do you want - 🌠 for mood, 💊 for health.
    today_text: Today average for polls of type {} - {}.
    today_fail: Insufficient data to calculate average.
    email_wrong_code: Wrong code. Try again.
    email_wrong_adress: Wrong email adress format. Try again - send a message with your email adress only
    email_wrong_domen: Only @phystech.edu email adresses are supported. Try again...
    email_sent: |
      I've sent a verification email to your adress with a code.
      Send me the code you've got.
    help_fail: There's no such command.
    must_register: To use the bot you must register. Use /start to start registration
    survey_request: |
      Can you please fill out this short survey?
      {}
    survey_expired: Survey was closed. Thanks for particicpation!
    thanks: Thanks.
    demog_init: |
      Before you can start using this bot, answer a few questions about yourself.
      ---
