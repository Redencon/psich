    registration_closed: I am unable to verify new users now. Please, come back later.
    delete: |
      Are you sure you want to delete all your data?
      THIS ACTION IS IRREVERSIBLE
    language: You've chosen English language
    yes: "Yes"
    no: "No"
    ok: OK
    nodata: No data for you is stored. Redo registration with /start
  achievements:
    streak_3:
      name: First Steps.
      description: Responding to PSI_bot's daily surveys 3 days in a row.
      congrats: You've been answering my surveys for 3 days in a row now! Keep up the good work
    streak_7:
